<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSearch Singapore</title>
    <!--poppins, anonymous pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--AEGLESEEKER -->
<audio id="bg-audio" src="images/Aegleseeker.mp3" loop></audio>
<button id="toggle-audio">Play Music</button>


    <!--top navigation bar-->
	
    <header class="navbar">
        <div class="logo-area">
            <img src="images/MedSearchlogo-modified.png" alt="MedSearch Logo" class="logo-image">
            <span class="logo-text">MedSearch Singapore</span>
        </div>
        <nav class="nav-links">
            <a href="#">Our Solutions</a>
            <a href="#">Mission</a>
            <a href="#">Projects</a>
            <a href="#" class="btn-nav">Join Us</a>
        </nav>
    </header>


    <!-- Hero content-->
    <main class="hero-section">
		
        <div class="hero-container">
            <h1 class="hero-title">MedSearch<br>Singapore</h1>
            <p class="hero-subheading">subheadingsubheadingsubheadingsubheading</p>
			<iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/63xUtWhWVdDTV73QSB6qyT?utm_source=generator&si=bc7497c49e66482f" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            
			<a href="#" class="btn-main">Join Us</a>
			<!--carousel-->
			<div class="instagram-carousel">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide">
					<a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
					<img src="images/carouselslide-main.png" alt="Slide 1"> 
					</a>
				</div>
                <div class="carousel-slide">
					<a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
					<img src="images/carouselslide.png" alt="Slide 2">
					</a>
				</div>
                <div class="carousel-slide">
					<a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
					<img src="images/carouselslide1.png" alt="Slide 3">
					</a>
				</div>
                <div class="carousel-slide">
					<a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
					<img src="images/carouselslide2.png" alt="Slide 4">
					</a>
				</div>
            </div>

            <!--navibuttons-->
            <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous Slide">❮</button>
            <button class="nav-btn next-btn" id="nextBtn" aria-label="Next Slide">❯</button>

            <!--dots-->
            <div class="carousel-dots" id="carouselDots"></div>
        </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
